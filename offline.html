<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>离线提示 - 律所系统</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      margin: 0;
      background: #f5f5f5;
    }
    .offline-card {
      text-align: center;
      padding: 40px;
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
    }
    .icon {
      font-size: 64px;
      margin-bottom: 20px;
    }
    .brand-logo {
      display: none;
      width: 64px;
      height: 64px;
      margin: 0 auto 20px;
      object-fit: contain;
    }
    h1 { margin: 0 0 10px; color: #333; }
    p { color: #666; margin: 0; }
  </style>
</head>
<body>
  <div class="offline-card">
    <img id="brandLogo" class="brand-logo" alt="系统Logo" />
    <div class="icon">📡</div>
    <h1>网络连接已断开</h1>
    <p>请检查网络连接，部分功能可能无法使用</p>
  </div>
  <script>
    try {
      const branding = JSON.parse(
        localStorage.getItem('lawfirm-public-branding') || '{}',
      );
      const systemName = branding.name || '律所系统';
      const description =
        branding.description || '请检查网络连接，部分功能可能无法使用';
      const favicon = branding.favicon;
      const logo = branding.logo;

      document.title = `离线提示 - ${systemName}`;
      const message = document.querySelector('p');
      if (message) {
        message.textContent = description;
      }

      if (favicon) {
        let faviconLink = document.querySelector('link[rel="icon"]');
        if (!faviconLink) {
          faviconLink = document.createElement('link');
          faviconLink.rel = 'icon';
          document.head.appendChild(faviconLink);
        }
        faviconLink.href = favicon;
      }

      if (logo) {
        const logoEl = document.getElementById('brandLogo');
        if (logoEl) {
          logoEl.src = logo;
          logoEl.style.display = 'block';
        }
      }
    } catch {}
  </script>
</body>
</html>
