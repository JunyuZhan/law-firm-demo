<!-- ===== 演示控制台（部署时注入，非应用源码） ===== -->
<style>
#demo-panel{position:fixed;right:16px;bottom:16px;z-index:2147483647;width:284px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,"PingFang SC","Microsoft YaHei",sans-serif;font-size:13px;color:#1f2329;background:#fff;border:1px solid #e5e6eb;border-radius:12px;box-shadow:0 8px 30px rgba(0,0,0,.18);overflow:hidden}

#demo-panel .dp-row{display:flex;align-items:center;justify-content:space-between;padding:6px 0;border-bottom:1px dashed #f0f0f0}
#demo-panel .dp-row:last-child{border-bottom:none}
#demo-panel code{background:#f2f3f5;padding:2px 6px;border-radius:4px;font-family:ui-monospace,SFMono-Regular,Menlo,monospace}
#demo-panel button{flex:none;border:none;border-radius:6px;padding:4px 8px;background:#1677ff;color:#fff;cursor:pointer;font-size:12px}

#demo-panel .dp-select:focus{border-color:#1677ff}
#demo-panel.collapsed .dp-body{display:none}
</style>
<div id="demo-panel" class="collapsed">
  <div class="dp-head" id="dp-toggle"><b>演示模式 · Mock</b><span id="dp-caret">▸</span></div>
  <div class="dp-body">
    <div class="dp-tip">本站为开源演示，所有数据由浏览器内 Mock 提供，刷新或重置可恢复。</div>
    <div class="dp-field">
      <label class="dp-label">演示账号（密码 123456 已预填）</label>
      <select id="dp-account" class="dp-select"></select>
    </div>
    <div class="dp-row" style="margin-top:4px">
      <button id="dp-reset" class="ghost">重置演示数据</button>
      <button id="dp-gh">项目仓库</button>
    </div>
  </div>
</div>
<script>
(function(){
  var accounts=[{u:'admin',r:'超级管理员'},{u:'director',r:'主任'},{u:'lawyer1',r:'主办律师'},{u:'leader',r:'团队负责人'},{u:'finance',r:'财务'},{u:'staff',r:'行政'},{u:'trainee',r:'实习律师'}];
  var sel=document.getElementById('dp-account');
  accounts.forEach(function(a){
    var o=document.createElement('option');o.value=a.u;o.textContent=a.u+' · '+a.r;sel.appendChild(o);
  });
  // 登录表单自动预填：默认 admin / 123456；下拉切换账号即回填
  function setVal(el,v){var s=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value').set;s.call(el,v);el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}));}
  function fillAccount(u){var ins=[].slice.call(document.querySelectorAll('input'));var user=ins.filter(function(i){return i.placeholder==='请输入用户名';})[0];var pass=ins.filter(function(i){return i.placeholder==='密码';})[0];if(user&&pass){setVal(user,u);setVal(pass,'123456');}}
  sel.addEventListener('change',function(){fillAccount(sel.value);});
  setInterval(function(){var ins=[].slice.call(document.querySelectorAll('input'));var user=ins.filter(function(i){return i.placeholder==='请输入用户名';})[0];var pass=ins.filter(function(i){return i.placeholder==='密码';})[0];if(user&&pass&&user.value===''&&pass.value===''){fillAccount(sel.value);}},600);
  document.getElementById('dp-toggle').onclick=function(){var p=document.getElementById('demo-panel');p.classList.toggle('collapsed');document.getElementById('dp-caret').textContent=p.classList.contains('collapsed')?'▸':'▾';};
  document.getElementById('dp-gh').onclick=function(){window.open('https://github.com/JunyuZhan/law-firm-demo','_blank');};
  document.getElementById('dp-reset').onclick=function(){
    if(!navigator.serviceWorker||!navigator.serviceWorker.controller){location.reload();return;}
    fetch('/api/demo/reset',{method:'POST'}).then(function(){location.reload();}).catch(function(){location.reload();});
  };

  /* ===== 应用入口：等 Service Worker（Mock 后端）接管页面后再加载，避免 /api 首屏 404 ===== */
  function loadApp(){
    if(window.__appLoaded) return;
    var e=document.getElementById('app-entry');
    if(!e) return;
    window.__appLoaded=true;
    var n=document.createElement('script');
    n.type='module'; n.crossOrigin='anonymous';
    n.src=e.getAttribute('src')||e.src;
    document.head.appendChild(n);
    e.remove();
  }
  function boot(){
    if(!('serviceWorker' in navigator)){ loadApp(); return; }
    navigator.serviceWorker.register('/sw.js',{scope:'/'}).then(function(){
      // SW 已接管本页则直接加载；否则等接管事件（sw.js 内 clients.claim() 会触发）
      if(navigator.serviceWorker.controller){ loadApp(); return; }
      navigator.serviceWorker.addEventListener('controllerchange', loadApp);
      // 兜底：极少数情况下 controllerchange 未触发，3s 后仍然加载（此时 SW 通常已激活）
      setTimeout(function(){ if(!window.__appLoaded) loadApp(); }, 3000);
    }).catch(function(e){ console.warn('SW 注册失败',e); loadApp(); });
  }
  if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded', boot); }
  else { boot(); }
})();
</script>
</body></html>
