<script>
(function(){
  var accounts=[{u:'admin',r:'超级管理员'},{u:'director',r:'主任'},{u:'lawyer1',r:'主办律师'},{u:'leader',r:'团队负责人'},{u:'finance',r:'财务'},{u:'staff',r:'行政'},{u:'trainee',r:'实习律师'}];
  var box=document.getElementById('dp-accounts');
  accounts.forEach(function(a){
    var row=document.createElement('div');row.className='dp-row';
    row.innerHTML='<span><code>'+a.u+'</code> <span style="color:#86909c">'+a.r+'</span></span>';
    var btn=document.createElement('button');btn.textContent='复制';
    btn.onclick=function(){var t=a.u+' / 123456';if(navigator.clipboard)navigator.clipboard.writeText(t);btn.textContent='已复制';setTimeout(function(){btn.textContent='复制';},1200);};
    row.appendChild(btn);box.appendChild(row);
  });
  document.getElementById('dp-toggle').onclick=function(){var p=document.getElementById('demo-panel');p.classList.toggle('collapsed');document.getElementById('dp-caret').textContent=p.classList.contains('collapsed')?'▸':'▾';};
  document.getElementById('dp-gh').onclick=function(){window.open('https://github.com/JunyuZhan','_blank');};
  document.getElementById('dp-reset').onclick=function(){
    if(!navigator.serviceWorker||!navigator.serviceWorker.controller){location.reload();return;}
    fetch('/api/demo/reset',{method:'POST'}).then(function(){location.reload();}).catch(function(){location.reload();});
  };
  if('serviceWorker' in navigator){
    var swRebooted = sessionStorage.getItem('sw_rebooted');
    navigator.serviceWorker.register('/sw.js',{scope:'/'}).then(function(){
      // 首次访问时 SW 尚未接管本页，先行请求 /api 会 404 导致白屏；
      // 待 SW 接管本页后自动刷新一次，保证所有 /api 请求被拦截。
      if(!navigator.serviceWorker.controller && !swRebooted){
        var done=false;
        function reboot(){ if(done) return; done=true; sessionStorage.setItem('sw_rebooted','1'); location.reload(); }
        navigator.serviceWorker.addEventListener('controllerchange', reboot);
        setTimeout(reboot, 2000); // 兜底：若 controllerchange 未触发则 2s 后刷新
      }
    }).catch(function(e){console.warn('SW 注册失败',e);});
  }
})();
</script>
