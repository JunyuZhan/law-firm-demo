<script>
(function(){
  var accounts=[{u:'admin',r:'超级管理员'},{u:'director',r:'主任'},{u:'lawyer1',r:'主办律师'},{u:'leader',r:'团队负责人'},{u:'finance',r:'财务'},{u:'staff',r:'行政'},{u:'trainee',r:'实习律师'}];
  var sel=document.getElementById('dp-account');
  accounts.forEach(function(a){
    var o=document.createElement('option');o.value=a.u;o.textContent=a.u+' · '+a.r;sel.appendChild(o);
  });
  // 登录表单自动预填：默认 admin / 123456；下拉切换账号即回填
  function setVal(el,v){var s=Object.getOwnPropertyDescriptor(HTMLInputElement.prototype,'value').set;s.call(el,v);el.dispatchEvent(new Event('input',{bubbles:true}));el.dispatchEvent(new Event('change',{bubbles:true}));}
  function fillAccount(u){var ins=[].slice.call(document.querySelectorAll('input'));var user=ins.filter(function(i){return i.placeholder==='请输入用户名';})[0];var pass=ins.filter(function(i){return i.placeholder==='密码';})[0];if(user&&pass){setVal(user,u);setVal(pass,'123456');}}
  sel.addEventListener('change',function(){fillAccount(sel.value);});
  setInterval(function(){var ins=[].slice.call(document.querySelectorAll('input'));var user=ins.filter(function(i){return i.placeholder==='请输入用户名';})[0];var pass=ins.filter(function(i){return i.placeholder==='密码';})[0];if(user&&pass&&user.value===''&&pass.value===''){fillAccount(sel.value);}},600);
  document.getElementById('dp-toggle').onclick=function(){var p=document.getElementById('demo-panel');p.classList.toggle('collapsed');document.getElementById('dp-caret').textContent=p.classList.contains('collapsed')?'▸':'▾';};
  document.getElementById('dp-gh').onclick=function(){window.open('https://github.com/JunyuZhan/law-firm-demo','_blank');};
  document.getElementById('dp-reset').onclick=function(){
    fetch('/api/demo/reset',{method:'POST'}).then(function(){location.reload();}).catch(function(){location.reload();});
  };

  /* ===== Mock 后端：页面内拦截 /api/*（不再依赖 Service Worker） =====
   * 把 sw.js 的逻辑原样在页面内运行（self 指向桩对象），捕获其 fetch 处理器，
   * 再用 fetch / XMLHttpRequest 拦截器把 /api 请求喂给它。逻辑零改动、行为完全一致。
   * 同时注销所有已存在的 SW（清理用户浏览器里卡住的老 SW），确保无论如何都能正常工作。
   * 这样彻底摆脱 SW 注册竞态 / Cloudflare 缓存 / 浏览器兼容 / 无痕差异等问题。 */
  function loadApp(){
    if(window.__appLoaded) return;
    var e=document.getElementById('app-entry');
    if(!e) return;
    window.__appLoaded=true;
    var n=document.createElement('script');
    n.type='module'; n.crossOrigin='anonymous';
    n.src=e.getAttribute('src')||e.src;
    document.head.appendChild(n);
    e.remove();
  }

  // 1) 清理可能卡住的旧 Service Worker（避免老 SW 继续接管 /api 造成 404）
  if('serviceWorker' in navigator){
    try{ navigator.serviceWorker.getRegistrations().then(function(regs){ regs.forEach(function(r){ try{ r.unregister(); }catch(_){} }); }).catch(function(){}); }catch(_){}
  }

  // 2) 桩 self：让 sw.js 在页面内运行
  var swSelf = {
    location: { origin: location.origin },
    registration: { scope: '/' },
    _h: {},
    addEventListener: function(t, fn){ this._h[t] = fn; },
    skipWaiting: function(){ return Promise.resolve(); },
    clients: { claim: function(){ return Promise.resolve(); }, matchAll: function(){ return Promise.resolve([]); } },
    caches: (typeof caches !== 'undefined') ? caches : { open: function(){ return Promise.resolve({ addAll:function(){}, put:function(){}, match:function(){} }); }, keys:function(){return Promise.resolve([]);}, delete:function(){} }
  };

  // 3) Mock 请求处理器（由 sw.js 提供，先置空） + 请求队列
  var fetchHandler = null;
  var _apiQueue = [];
  var _handlerReady = false;
  function mockFetch(url, opts){
    opts = opts || {};
    var req = new Request(url, { method: (opts.method||'GET'), headers: opts.headers, body: opts.body });
    var event = { request: req, respondWith: function(p){ event._p = p; } };
    fetchHandler(event);
    return event._p;
  }
  // Mock 就绪前先把 /api 请求入队，就绪后统一重放 —— 这样应用可立即并行下载，无需等 sw.js
  function dispatch(url, opts){
    if(fetchHandler){ return mockFetch(url, opts); }
    return _origFetch ? _origFetch(url, opts) : Promise.reject(new Error('mock unavailable'));
  }
  function flushQueue(){
    if(!_handlerReady) return;
    var q = _apiQueue; _apiQueue = [];
    q.forEach(function(it){ dispatch(it.url, it.opts).then(it.resolve).catch(it.reject); });
  }

  // 4) 预装拦截器（fetch + XHR）：/api 在 Mock 就绪前入队，就绪后直连
  var _origFetch = window.fetch ? window.fetch.bind(window) : null;
  window.fetch = function(input, init){
    var u = (typeof input==='string') ? input : (input && input.url) || '';
    var abs = new URL(u, location.href).href;
    if(new URL(abs).pathname.startsWith('/api')){
      if(_handlerReady) return dispatch(abs, init);
      return new Promise(function(res, rej){ _apiQueue.push({ url:abs, opts:init, resolve:res, reject:rej }); });
    }
    return _origFetch ? _origFetch(input, init) : fetch(input, init);
  };
  var _NativeXHR = window.XMLHttpRequest;
  function MockXHR(){
    this._headers = {}; this._method='GET'; this._url=''; this._async=true; this.withCredentials=false;
    this.readyState=0; this.status=0; this.statusText=''; this.responseText=''; this.response=null;
    this.onreadystatechange=null; this.onload=null; this.onerror=null; this.onloadend=null;
  }
  MockXHR.prototype.open = function(m,u,a){ this._method=m; this._url=u; this._async=(a!==false); };
  MockXHR.prototype.setRequestHeader = function(k,v){ this._headers[k]=v; };
  MockXHR.prototype.getAllResponseHeaders = function(){ return this._respHeaders||''; };
  MockXHR.prototype.getResponseHeader = function(k){ return (this._respHeaderMap && this._respHeaderMap[k.toLowerCase()])||null; };
  MockXHR.prototype.abort = function(){};
  MockXHR.prototype.send = function(body){
    var selfX = this;
    var abs, path;
    try { abs = new URL(this._url, location.href).href; path = new URL(abs).pathname; } catch(e){ abs=this._url; path=''; }
    function settle(resp){
      selfX.status = resp.status; selfX.statusText = resp.statusText;
      resp.text().then(function(t){
        selfX.responseText = t; selfX.response = t;
        var h=''; var m={}; resp.headers.forEach(function(v,k){ h+=k+': '+v+'\r\n'; m[k.toLowerCase()]=v; });
        selfX._respHeaders=h; selfX._respHeaderMap=m;
        selfX.readyState=4;
        if(selfX.onreadystatechange) selfX.onreadystatechange();
        if(selfX.onload) selfX.onload();
        if(selfX.onloadend) selfX.onloadend();
      });
    }
    function fail(e){ selfX.status=500; selfX.statusText=String(e); selfX.readyState=4; if(selfX.onerror) selfX.onerror(e); if(selfX.onloadend) selfX.onloadend(); }
    if(path.startsWith('/api')){
      var hdrs = new Headers();
      for (var k in this._headers) hdrs.set(k, this._headers[k]);
      if (body && !hdrs.has('content-type')) hdrs.set('content-type','application/json');
      var p = _handlerReady
        ? dispatch(abs, { method:this._method, headers:hdrs, body:body })
        : new Promise(function(res,rej){ _apiQueue.push({ url:abs, opts:{ method:selfX._method, headers:hdrs, body:body }, resolve:res, reject:rej }); });
      p.then(settle).catch(fail);
    } else {
      var xhr = new _NativeXHR();
      xhr.open(selfX._method, selfX._url, selfX._async);
      for (var k2 in selfX._headers) xhr.setRequestHeader(k2, selfX._headers[k2]);
      xhr.withCredentials = selfX.withCredentials;
      xhr.onreadystatechange = function(){ selfX.readyState=xhr.readyState; selfX.status=xhr.status; selfX.statusText=xhr.statusText; selfX.responseText=xhr.responseText; selfX.response=xhr.response; if(selfX.onreadystatechange) selfX.onreadystatechange(); };
      xhr.onload = function(){ if(selfX.onload) selfX.onload(); };
      xhr.onerror = function(e){ if(selfX.onerror) selfX.onerror(e); };
      xhr.onloadend = function(){ if(selfX.onloadend) selfX.onloadend(); };
      xhr.send(body);
    }
  };
  window.XMLHttpRequest = MockXHR;

  // 5) 并行：应用 bundle 与 sw.js 同时下载；Mock 先入队，就绪后重放。
  //    不再等 sw.js 拉完才加载应用（旧逻辑会多等一次串行往返），首屏更快。
  function bootMock(){
    loadApp();
    fetch('/sw.js').then(function(r){ return r.text(); }).then(function(code){
      try { (new Function('self', code))(swSelf); } catch(e){ console.warn('Mock 初始化失败', e); _handlerReady=true; flushQueue(); return; }
      fetchHandler = swSelf._h['fetch'];
      if(!fetchHandler){ console.warn('Mock 未捕获到 fetch 处理器'); }
      _handlerReady = true; flushQueue();
    }).catch(function(e){ console.warn('sw.js 加载失败', e); _handlerReady=true; flushQueue(); });
  }

  if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded', bootMock); }
  else { bootMock(); }
})();
</script>
